name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from the build job!"

      - name: List files
        run: ls -la

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that index.html exists
        run: test -f index.html && echo "index.html found"

  test-matrix:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true 
      matrix:
        node-version: [14, 16, 18]
    steps:
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{matrix.node-version}} 
    - name: Run Tests
      run: echo "Test läuft mit Node.js ${{matrix.node-version}} "

  security-scan:
    needs: test-matrix
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security scan
        id: scan
        continue-on-error: true 
        run: |
          echo "Suche nach möglichen Secrets im Code..."
          if grep -rniE "password|secret|api[_-]?key" --exclude-dir=.git --exclude-dir=.github .; then
            echo "Mögliche Secrets gefunden!"
            exit 1
          fi
          echo "Keine Auffälligkeiten gefunden."

      - name: Warnung ausgeben
        if: steps.scan.outcome == 'failure'
        run: echo "::warning title=Security Scan::Der Security Scan hat Probleme gefunden. Bitte Log prüfen."
